<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Splatoon XP Counter Overlay</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@1,700&family=M+PLUS+Rounded+1c:wght@900&family=Montserrat:ital,wght@1,900&family=Orbitron:wght@900&family=Russo+One&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background-color: transparent !important; overflow: hidden; }
.main-container { width: 1500px; height: 500px; position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden; padding: 10px 40px; }
.bg-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; display: none; }
.xp-display {
  position: relative; z-index: 2; font-weight: 900; white-space: nowrap; line-height: 1; letter-spacing: 2px;
  font-family: 'Russo One', sans-serif; color: #00ff66; transform: skewX(-8deg);
  text-shadow: -8px 8px 0 #000, 8px 8px 0 #000, -8px -8px 0 #000, 8px 8px 0 #000, -12px 0px 0 #000, 12px 0px 0 #000, 0px -12px 0 #000, 0px 12px 0 #000, 14px 14px 25px rgba(0,0,0,0.85);
}
</style>
</head>
<body>
<div class="main-container" id="mainContainer">
  <img id="bgImage" class="bg-image" alt="Background">
  <div class="xp-display" id="xpDisplay">XP 2000</div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const roomId = urlParams.get('id') || 'default';
const storageKey = `splat_xp_data_${roomId}`;
const channelName = `splat_xp_bc_${roomId}`;

function adjustFontSize() {
  const container = document.getElementById('mainContainer');
  const text = document.getElementById('xpDisplay');
  if (!container || !text) return;
  const maxWidth = container.clientWidth - 120, maxHeight = container.clientHeight - 80;
  let fontSize = 380;
  text.style.fontSize = fontSize + 'px';
  while ((text.offsetWidth > maxWidth || text.offsetHeight > maxHeight) && fontSize > 10) {
    fontSize -= 2;
    text.style.fontSize = fontSize + 'px';
  }
}

function applyState(data) {
  if (!data) return;
  document.getElementById('xpDisplay').innerText = `XP ${data.xp}`;
  document.getElementById('xpDisplay').style.fontFamily = data.font;
  document.getElementById('xpDisplay').style.color = data.color;
  const img = document.getElementById('bgImage');
  if (data.bgData) {
    img.src = data.bgData;
    img.style.display = 'block';
  } else {
    img.style.display = 'none';
    img.src = '';
  }
  localStorage.setItem(storageKey, JSON.stringify(data));
  adjustFontSize();
}

// 保存済みデータの読み込み
const saved = localStorage.getItem(storageKey);
if (saved) {
  try { applyState(JSON.parse(saved)); } catch(e){}
}

// BroadcastChannel による即時受信
const bc = new BroadcastChannel(channelName);
bc.onmessage = (e) => applyState(e.data);

// PeerJS による P2P 受信設定
let peer = new Peer();
let activeConn = null;

peer.on('open', () => connectToController());

function connectToController() {
  if (activeConn && activeConn.open) return;
  
  const conn = peer.connect(`splat-xp-ctrl-${roomId}`);
  
  conn.on('open', () => {
    activeConn = conn;
  });
  
  conn.on('data', (data) => {
    applyState(data);
  });
  
  conn.on('close', () => {
    activeConn = null;
    setTimeout(connectToController, 3000);
  });
  
  conn.on('error', () => {
    activeConn = null;
    setTimeout(connectToController, 3000);
  });
}

document.fonts.ready.then(adjustFontSize);
</script>
</body>
</html>
